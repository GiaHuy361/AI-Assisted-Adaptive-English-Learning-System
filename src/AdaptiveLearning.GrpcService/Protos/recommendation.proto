syntax = "proto3";

option csharp_namespace = "AdaptiveLearning.GrpcService";

package recommendation;

service RecommendationService {
  rpc GetRecommendations (RecommendationRequest) returns (RecommendationResponse);
  rpc GetWeaknessAnalysis (WeaknessAnalysisRequest) returns (WeaknessAnalysisResponse);
  rpc GetServiceStatus (StatusRequest) returns (StatusResponse);
}

message RecommendationRequest {
  int32 user_id = 1;
  int32 count = 2;
}

message RecommendationResponse {
  int32 user_id = 1;
  repeated string recommended_lesson_ids = 2;
  string explanation = 3;
}

message WeaknessAnalysisRequest {
  int32 user_id = 1;
}

message WeaknessAnalysisResponse {
  int32 user_id = 1;
  repeated string weak_skills = 2;
  string details = 3;
}

message StatusRequest {}

message StatusResponse {
  string status = 1; // e.g. "OK", "HEALTHY"
  string version = 2;
}
