version: '3.8'

services:
  mysql:
    image: mysql:8.0.33
    container_name: adaptive-learning-mysql
    restart: always
    ports:
      - "33066:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-AdaptiveEnglishLearningDb}
      MYSQL_USER: ${MYSQL_USER:-adaptive_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-12345}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-12345}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - adaptive-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.2.4-alpine
    container_name: adaptive-learning-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - adaptive-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: adaptive-learning-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - adaptive-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grpc-service:
    build:
      context: .
      dockerfile: src/AdaptiveLearning.GrpcService/Dockerfile
    container_name: adaptive-learning-grpc-service
    restart: always
    ports:
      - "50051:50051"
      - "50080:50080"
    networks:
      - adaptive-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: src/CoreLearningSystem.API/Dockerfile
    container_name: adaptive-learning-api
    restart: always
    ports:
      - "5292:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-AdaptiveEnglishLearningDb};Uid=${MYSQL_USER:-adaptive_user};Pwd=${MYSQL_PASSWORD:-12345};"
      Kafka__BootstrapServers: "kafka:29092"
      Redis__ConnectionString: "redis:6379"
      RecommendationGrpc__ServiceUrl: "http://grpc-service:50051"
      JwtSettings__Secret: ${JWT_SECRET:-YOUR_SUPER_SECRET_JWT_KEY_WITH_AT_LEAST_256_BITS_OF_ENTROPY}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - adaptive-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  worker:
    build:
      context: .
      dockerfile: src/AdaptiveLearning.Worker/Dockerfile
    container_name: adaptive-learning-worker
    restart: always
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-AdaptiveEnglishLearningDb};Uid=${MYSQL_USER:-adaptive_user};Pwd=${MYSQL_PASSWORD:-12345};Allow User Variables=True;"
      Kafka__BootstrapServers: "kafka:29092"
      Redis__ConnectionString: "redis:6379"
      RecommendationGrpc__ServiceUrl: "http://grpc-service:50051"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      grpc-service:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - adaptive-network
    healthcheck:
      test: ["CMD-SHELL", "grep -q overall=Healthy /tmp/adaptive-worker-health.txt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: adaptive-learning-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - adaptive-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: adaptive-learning-redis-commander
    restart: unless-stopped
    ports:
      - "8086:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - adaptive-network

volumes:
  mysql-data:
  redis-data:
  kafka-data:

networks:
  adaptive-network:
    driver: bridge
